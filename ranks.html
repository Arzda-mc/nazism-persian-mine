<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1b1009"><link rel="manifest" href="manifest.json">
<title>مقامات کلن | حزب آلمان</title>
<style>
:root{--gold:#ffbd62;--text:#f5e7d4;--muted:#c4ad95;--line:#61432b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#39200d,#170c05 50%,#0c0704);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.9}
.wrap{width:min(850px,92%);margin:auto}.top{padding:17px 0;border-bottom:1px solid #70451f;background:#130b06}.topin{display:flex;justify-content:space-between;align-items:center;gap:10px}.back{border:1px solid var(--line);padding:6px 13px;border-radius:12px;color:var(--gold);font-size:13px}
header{text-align:center;padding:28px 0 20px}header small{color:#efa044}h1{margin:4px 0;color:#e98a2d;font-size:34px}.intro{color:var(--muted);font-size:14px}
.group{margin:13px 0;border:1px solid #62452d;border-radius:17px;overflow:hidden;background:#1c110b}
summary{cursor:pointer;list-style:none;padding:14px 17px;display:flex;justify-content:space-between;align-items:center;font-weight:bold;color:#ffd096;background:linear-gradient(90deg,#26170e,#39210f)}
summary::-webkit-details-marker{display:none}summary:after{content:"＋";font-size:21px;color:#efa044}details[open] summary:after{content:"−"}
.items{padding:7px 15px 12px}.item{padding:10px 5px;border-bottom:1px solid #493222;color:#e9d5bd}.item:last-child{border:0}.item small{display:block;color:#b99b7b;font-size:11px;direction:ltr;text-align:right}
footer{text-align:center;color:#bca58d;font-size:11px;padding:28px 0}
</style></head>
<body>
<div class="top"><div class="wrap topin"><b style="color:#ffd092">🍁 حزب آلمان | پرشین ماین</b><a class="back" href="index.html">بازگشت به صفحه اصلی</a></div></div>
<main class="wrap">
<header><small>ساختار سازمانی کلن</small><h1>مقامات و درجات</h1><div class="intro">برای مشاهده عنوان‌ها، هر بخش را انتخاب کنید.</div></header>
<div id="list"></div>
</main>
<footer>ساختار مقامات کلن حزب آلمان • پرشین ماین</footer>
<script>
const groups=[
["رهبری کلن",["رهبر کلن","معاون رهبر","فرمانده کل قوا"]],
["قوه مجریه · دولت",["رئیس‌جمهور","سخنگوی دولت","وزیر امور خارجه","فرمانده نیروی انتظامی","فرمانده قوه قضاییه"]],
["قوه مقننه · شورای عالی",["مجلس شورای عالی","رئیس شورای عالی","مجلس شورای نگهبان"]],
["فرماندهی عالی",["هد فیلد مارشال","سنیور فیلد مارشال","فیلدمارشال","ژنرال‌اوبرست","ژنرال پیاده‌نظام","ژنرال زرهی","ژنرال توپخانه","سپهبد","سرلشکر"]],
["افسران و فرماندهان",["سردار اول","سردار دوم","سرتیپ یکم","سرتیپ دوم","سرهنگ","سرهنگ دوم","سرگرد","سروان","ستوان یکم","ستوان دوم"]],
["درجات پایه",["استوار یکم","استوار دوم","گروهبان ارشد","سرباز"]]
];
const host=document.getElementById('list');
groups.forEach((g,i)=>{const d=document.createElement('details');d.className='group';if(i===0)d.open=true;const s=document.createElement('summary');s.textContent=g[0];d.appendChild(s);const box=document.createElement('div');box.className='items';g[1].forEach((title,j)=>{const row=document.createElement('div');row.className='item';row.textContent=String(j+1).padStart(2,'۰')+' ـ '+title;box.appendChild(row)});d.appendChild(box);host.appendChild(d)});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
